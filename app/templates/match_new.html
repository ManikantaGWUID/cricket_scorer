<!doctype html>
<html>
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Create Match</title>
  <link rel="stylesheet" href="/static/style.css"/>
</head>
<body>
<header><h1>Create Match</h1><nav><a href="/logout">Logout</a></nav></header>

<section class="card">
  <form id="create">
    <input name="teamA" placeholder="Team A" required />
    <input name="teamB" placeholder="Team B" required />
    <label>Overs per innings</label>
    <input name="overs" type="number" min="1" max="50" value="20" required />
    <button>Create Match</button>
  </form>
  <p id="next"></p>
</section>

<script>
async function postJSON(u,d){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});if(!r.ok)throw new Error(await r.text());return r.json();}
const f=document.getElementById('create');
f.onsubmit = async (e)=>{
  e.preventDefault();
  const p={ teamA:f.teamA.value, teamB:f.teamB.value, overs_per_innings:parseInt(f.overs.value) };
  const out = await postJSON('/api/matches', p);
  document.getElementById('next').innerHTML =
    `Match created: <b>${out.matchId}</b><br/>Continue → ` +
    `<a href="/admin/match/${out.matchId}/teams">Teams</a>`;
};
</script>
</body></html>
